<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section 01 — The Problem</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#0a0a0a; font-family:'Times New Roman', serif;">

  <!-- Background dot pattern -->
  <svg width="960" height="540" style="position:absolute; top:0; left:0; opacity:0.06; pointer-events:none;" aria-hidden="true">
    <defs>
      <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1.5" fill="#D4AF37"/>
      </pattern>
    </defs>
    <rect width="960" height="540" fill="url(#dots)"/>
  </svg>

  <!-- Large section number on the left -->
  <p style="position:absolute; left:80px; top:130px; margin:0; font-size:200px; font-weight:700; color:#D4AF37; line-height:1.0; letter-spacing:-4px;">01</p>

  <!-- Gold vertical accent bar between number and text -->
  <svg width="3" height="240" style="position:absolute; left:380px; top:160px;" aria-hidden="true">
    <rect x="0" y="0" width="3" height="240" fill="#D4AF37"/>
  </svg>

  <!-- Section title -->
  <p style="position:absolute; left:420px; top:200px; margin:0; font-size:14px; font-weight:600; letter-spacing:5px; color:#0070F3;">SECTION ONE</p>
  <p style="position:absolute; left:420px; top:230px; margin:0; font-size:54px; font-weight:700; color:#ffffff; line-height:1.0;">The Problem</p>
  <p style="position:absolute; left:420px; top:300px; margin:0; font-size:18px; font-weight:400; color:#a3a3a3; line-height:1.5; max-width:440px;">When you chain a dozen AI agents together by hand,<br>context disappears, gates get skipped, and the<br>final pack has to be assembled by a tired human.</p>

  <!-- Bottom-left meta -->
  <p style="position:absolute; left:80px; top:480px; margin:0; font-size:12px; letter-spacing:3px; color:#737373;">VORTEX-OS / WALKTHROUGH</p>

  <!-- Page number badge -->
  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
    <circle cx="18" cy="18" r="18" fill="#D4AF37"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0a0a0a" font-family="Times New Roman, serif">03</text>
  </svg>

</div>
</body>
</html>
