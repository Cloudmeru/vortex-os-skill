name: Release (zip)

# On a tag push matching v*, zip the skill folder (excluding
# .git / .vortex / IDE junk) and attach it to a GitHub Release
# with auto-generated notes.
#
# v0.3.0+: brings parity with the engine's release workflow
# (Cloudmeru/vortex-os-dotnet/blob/main/.github/workflows/release.yml).
# The engine attaches 4 binaries; the skill ships as source files
# (PowerShell scripts + manifests) so a single zip is the natural
# artifact. install.ps1 inside the zip is the install entry point.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default GITHUB_TOKEN is read-only. Need write to create releases
# and attach assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 1. Derive the version from the tag (strip the leading 'v').
      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.0.0"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for $VERSION"

      # 2. Zip the skill folder. Exclude:
      #    - .git/                     (the git directory itself)
      #    - .vortex/                  (engine cache, regenerable)
      #    - walkthrough/slides/imgs/_gen_*  (generated by slide-build)
      #    - *.ps1xml~                 (PowerShell editor backups)
      #    - .vs/ + .idea/             (IDE junk)
      #    - *.bak, *.orig, *.tmp      (misc backups)
      - name: Zip the skill
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          OUT="vortex-os-skill-v${VERSION}.zip"
          zip -r "$OUT" . \
            -x '.git/*' \
            -x '.vortex/*' \
            -x '.vs/*' \
            -x '.idea/*' \
            -x 'walkthrough/slides/imgs/_gen_*' \
            -x '*.ps1xml~' \
            -x '*.bak' \
            -x '*.orig' \
            -x '*.tmp'
          echo "Wrote $OUT:"
          unzip -l "$OUT" | head -20

      # 3. Create the GitHub Release with the zip attached.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VORTEX-OS skill ${{ steps.get_version.outputs.version }}"
          generate_release_notes: true
          files: |
            vortex-os-skill-v${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
