name: Release (zip)

# On a tag push matching v*, zip the skill folder (excluding
# .git / .vortex / IDE junk) and attach it to a GitHub Release
# with auto-generated notes.
#
# v0.3.0+: brings parity with the engine's release workflow
# (Cloudmeru/vortex-os-dotnet/blob/main/.github/workflows/release.yml).
# The engine attaches 4 binaries; the skill ships as source files
# (PowerShell scripts + manifests) so a single zip is the natural
# artifact. install.ps1 inside the zip is the install entry point.
#
# Both triggers supported:
#   - tag push (auto on `git push origin vX.Y.Z`)
#   - workflow_dispatch (manual from the Actions tab; provide
#     `tag` input like `v0.3.0`)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0). Must already exist on the remote.'
        required: true
        default: 'v0.3.0'

# Default GITHUB_TOKEN is read-only. Need write to create releases
# and attach assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 1. Derive the version + tag.
      #    - On tag push: github.ref_name is the tag ("vX.Y.Z")
      #    - On workflow_dispatch: inputs.tag provides it
      - name: Determine tag + version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for tag=$TAG version=$VERSION"

      # 2. Zip the skill folder. Exclude:
      #    - .git/                     (the git directory itself)
      #    - .vortex/                  (engine cache, regenerable)
      #    - walkthrough/slides/imgs/_gen_*  (generated by slide-build)
      #    - *.ps1xml~                 (PowerShell editor backups)
      #    - .vs/ + .idea/             (IDE junk)
      #    - *.bak, *.orig, *.tmp      (misc backups)
      - name: Zip the skill
        run: |
          OUT="vortex-os-skill-${{ steps.get_version.outputs.tag }}.zip"
          zip -r "$OUT" . \
            -x '.git/*' \
            -x '.vortex/*' \
            -x '.vs/*' \
            -x '.idea/*' \
            -x 'walkthrough/slides/imgs/_gen_*' \
            -x '*.ps1xml~' \
            -x '*.bak' \
            -x '*.orig' \
            -x '*.tmp'
          echo "Wrote $OUT:"
          unzip -l "$OUT" | head -20

      # 3. Create the GitHub Release. We use `gh release create` instead
      #    of softprops/action-gh-release@v2 because the latter refuses
      #    to run on workflow_dispatch ("GitHub Releases requires a tag").
      #    `gh release create` accepts a --target ref and works for
      #    both triggers.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          ZIP="vortex-os-skill-${{ steps.get_version.outputs.tag }}.zip"
          # --generate-notes fills the body from PRs + commits
          # --draft first so a failure doesn't leave a half-made release
          # then publish to flip from draft to released.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VORTEX-OS skill ${{ steps.get_version.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            "$ZIP"
